services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goodlock}
      POSTGRES_USER: ${POSTGRES_USER:-goodlock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goodlock}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goodlock} -d ${POSTGRES_DB:-goodlock}"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
